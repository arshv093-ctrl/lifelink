version: '3.8'

services:
  # 1. PostgreSQL 16 Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: lifelink-postgres-24bce2119
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelink_user
      POSTGRES_PASSWORD: ChangeMeSecure2026!
      POSTGRES_DB: lifelink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink_user -d lifelink_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. LifeLink API Backend (Node.js 22 / Express / TypeScript)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lifelink-api-24bce2119
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://lifelink_user:ChangeMeSecure2026!@postgres:5432/lifelink_db?schema=public
      JWT_SECRET: lifelink-jwt-secret-vit-24bce2119-arshvardhansingh
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. LifeLink Frontend (React / Vite / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: lifelink-web-24bce2119
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
